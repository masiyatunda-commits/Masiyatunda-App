<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Careers — Masiyatunda</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;font-family:Inter,Segoe UI,Arial;background:#051329;color:#fff}.top{padding:16px 22px;border-bottom:2px solid #d4af37;display:flex;justify-content:space-between;align-items:center}.wrap{max-width:1000px;margin:30px auto;padding:0 16px}.job{background:#fff;color:#172033;border-radius:14px;padding:20px;margin:15px 0}.btn{background:#d4af37;border:0;border-radius:8px;padding:11px 15px;font-weight:900;cursor:pointer}.field{margin:10px 0}.field input,.field textarea{width:100%;box-sizing:border-box;padding:11px;border:1px solid #cbd5e1;border-radius:8px}.modal{display:none;position:fixed;inset:0;background:#000b;align-items:center;justify-content:center;padding:18px}.modal.open{display:flex}.box{background:#fff;color:#172033;border-radius:15px;padding:22px;width:min(650px,100%);box-sizing:border-box}.close{float:right;border:0;background:none;font-size:25px}</style><link rel="stylesheet" href="/milkyway/theme.css"><link rel="stylesheet" href="/milkyway/release.css"><link rel="stylesheet" href="/milkyway/themes.css?v=2"><script src="/milkyway/shared-theme.js?v=2"></script></head><body><header class="top"><strong>MASIYATUNDA — CAREERS</strong><a href="/" style="color:#fff;font-weight:800">Home</a></header><main class="wrap"><h1>Join Masiyatunda</h1><p>Explore current opportunities with Masiyatunda Co. Ltd.</p><div id="jobs">Loading...</div></main><div class="modal" id="modal"><div class="box"><button class="close" id="close">×</button><h2 id="jobTitle">Apply</h2><input type="hidden" id="careerId"><div class="field"><label>Full Name</label><input id="name"></div><div class="field"><label>Email</label><input id="email" type="email"></div><div class="field"><label>Phone</label><input id="phone"></div><div class="field"><label>Cover Note</label><textarea id="note"></textarea></div><div class="field"><label>CV URL (optional)</label><input id="cv"></div><button class="btn" id="send">Submit Application</button><p id="msg"></p></div></div><script>const SB_URL="https://wpclkhgizbvxuvbhbwzs.supabase.co",KEY="sb_publishable_GCFJ3Is8t8mdia4gLeHApg_M_3ez9xb",sb=supabase.createClient(SB_URL,KEY);const $=id=>document.getElementById(id);async function load(){const {data,error}=await sb.from('careers').select('*').eq('published',true).order('created_at',{ascending:false});$('jobs').innerHTML=error?'<p>'+error.message+'</p>':(data||[]).map(x=>`<article class="job"><h2>${x.title}</h2><p><strong>${x.department||''}</strong> · ${x.location||''} · ${x.employment_type||''}</p><p>${x.description||''}</p><p>${x.requirements||''}</p><button class="btn" onclick="apply('${x.id}','${(x.title||'').replace(/'/g,"\\'")}')">Apply Now</button></article>`).join('')||'<p>No vacancies published currently.</p>'}window.apply=(id,title)=>{$('careerId').value=id;$('jobTitle').textContent='Apply — '+title;$('modal').classList.add('open')};$('close').onclick=()=>$('modal').classList.remove('open');$('send').onclick=async()=>{const {error}=await sb.from('job_applications').insert({career_id:$('careerId').value,full_name:$('name').value,email:$('email').value,phone:$('phone').value,cover_note:$('note').value,cv_url:$('cv').value||null});$('msg').textContent=error?error.message:'Application received. Thank you.'};load();</script><script>if('serviceWorker' in navigator) addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}),{once:true});</script></body></html>
