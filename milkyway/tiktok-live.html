<!DOCTYPE html>
<html lang="sw">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LIVE • TikTok Style</title>
    <style>
      :root {
        --bg: #000;
        --white: #fff;
        --muted: rgba(255, 255, 255, 0.76);
        --soft: rgba(255, 255, 255, 0.1);
        --soft-2: rgba(255, 255, 255, 0.18);
        --red: #ff2d55;
        --red-deep: #e31b46;
        --dark: rgba(0, 0, 0, 0.38);
        --dark-strong: rgba(16, 16, 16, 0.62);
        --shadow: 0 12px 30px rgba(0, 0, 0, 0.32);
      }

      * {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: var(--bg);
        color: var(--white);
        font-family: Inter, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        overflow: hidden;
      }

      body {
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .live-shell {
        position: relative;
        width: 100vw;
        height: 100vh;
        background: #000;
        overflow: hidden;
      }

      .video-stage {
        position: absolute;
        inset: 0;
        background: #000;
      }

      video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        background: linear-gradient(135deg, #111 0%, #000 100%);
        transform: scaleX(1);
      }

      video.flip {
        transform: scaleX(-1);
      }

      .overlay {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          to bottom,
          rgba(0, 0, 0, 0.28),
          rgba(0, 0, 0, 0.05) 18%,
          rgba(0, 0, 0, 0.1) 38%,
          rgba(0, 0, 0, 0.46)
        );
        pointer-events: none;
      }

      .live-badge {
        position: absolute;
        left: 18px;
        top: 18px;
        z-index: 6;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border-radius: 999px;
        background: rgba(255, 45, 85, 0.18);
        border: 1px solid rgba(255, 45, 85, 0.38);
        color: #ffdfe9;
        font-weight: 800;
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .live-badge .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--red);
        box-shadow: 0 0 0 5px rgba(255, 45, 85, 0.15);
      }

      .topbar {
        position: absolute;
        top: 18px;
        left: 18px;
        right: 18px;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        z-index: 8;
      }

      .user-group {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .avatar {
        width: 46px;
        height: 46px;
        border-radius: 50%;
        background: linear-gradient(135deg, #ffa84c, #ff2d55 52%, #8b5cf6);
        display: grid;
        place-items: center;
        font-weight: 800;
        box-shadow: var(--shadow);
        border: 2px solid rgba(255, 255, 255, 0.25);
      }

      .user-meta {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .name-row {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .name {
        font-size: 15px;
        font-weight: 800;
      }

      .badge-check {
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #36a3ff;
        display: grid;
        place-items: center;
        font-size: 10px;
        line-height: 1;
      }

      .viewer-chip {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        align-self: flex-start;
        padding: 7px 10px;
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.28);
        color: rgba(255,255,255,0.9);
        font-size: 12px;
        font-weight: 600;
      }

      .viewer-chip .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--red);
        box-shadow: 0 0 0 4px rgba(255, 45, 85, 0.14);
      }

      .lock-btn {
        width: 42px;
        height: 42px;
        border: 0;
        border-radius: 50%;
        background: rgba(0, 0, 0, 0.38);
        color: var(--white);
        font-size: 18px;
        cursor: pointer;
        box-shadow: var(--shadow);
        backdrop-filter: blur(6px);
      }

      .side-controls {
        position: absolute;
        right: 18px;
        top: 52%;
        transform: translateY(-50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        z-index: 8;
      }

      .control-btn {
        width: 56px;
        height: 56px;
        border: none;
        border-radius: 50%;
        background: rgba(17, 17, 17, 0.56);
        color: var(--white);
        font-size: 24px;
        cursor: pointer;
        box-shadow: var(--shadow);
        backdrop-filter: blur(8px);
        transition: transform 0.15s ease, background 0.2s ease;
      }

      .control-btn:active {
        transform: scale(0.96);
      }

      .control-btn.mic-off {
        background: rgba(255, 45, 85, 0.2);
      }

      .action-stack {
        position: absolute;
        right: 18px;
        bottom: 100px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        z-index: 9;
      }

      .action-pill {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        color: var(--white);
        font-weight: 700;
      }

      .action-pill .icon {
        width: 52px;
        height: 52px;
        border-radius: 50%;
        background: rgba(255,255,255,0.16);
        display: grid;
        place-items: center;
        font-size: 24px;
        box-shadow: var(--shadow);
        backdrop-filter: blur(8px);
      }

      .action-pill .count {
        font-size: 12px;
        color: rgba(255,255,255,0.9);
      }

      .bottom-bar {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 18px;
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 18px;
        padding: 0 18px;
        z-index: 10;
      }

      .title-box {
        flex: 1;
        display: flex;
        align-items: center;
      }

      .input-wrap {
        position: relative;
        flex: 1;
        display: flex;
        align-items: center;
        height: 56px;
        padding: 0 18px;
        border-radius: 18px;
        background: rgba(0, 0, 0, 0.34);
        border: 1px solid rgba(255,255,255,0.14);
        box-shadow: var(--shadow);
        backdrop-filter: blur(6px);
      }

      .input-wrap input {
        width: 100%;
        background: transparent;
        border: none;
        outline: none;
        color: var(--white);
        font-size: 15px;
      }

      .input-wrap input::placeholder {
        color: rgba(255,255,255,0.7);
      }

      .action-group {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .secondary-btn, .primary-btn {
        border: none;
        cursor: pointer;
        font-weight: 800;
        letter-spacing: 0.01em;
        transition: transform 0.15s ease, opacity 0.2s ease;
      }

      .secondary-btn:active, .primary-btn:active {
        transform: scale(0.98);
      }

      .secondary-btn {
        height: 48px;
        min-width: 110px;
        border-radius: 16px;
        padding: 0 18px;
        background: rgba(255,255,255,0.12);
        color: var(--white);
        box-shadow: var(--shadow);
      }

      .primary-btn {
        height: 52px;
        min-width: 148px;
        border-radius: 18px;
        padding: 0 20px;
        background: linear-gradient(135deg, var(--red), var(--red-deep));
        color: #fff;
        box-shadow: 0 16px 30px rgba(255, 45, 85, 0.36);
      }

      .primary-btn.live {
        background: linear-gradient(135deg, #ff5a5f, #d93b46);
      }

      @media (max-width: 720px) {
        .topbar {
          left: 14px;
          right: 14px;
        }

        .bottom-bar {
          left: 14px;
          right: 14px;
          padding: 0;
          gap: 12px;
        }

        .action-group {
          display: grid;
          grid-template-columns: 1fr 1fr;
          width: 100%;
        }

        .secondary-btn, .primary-btn {
          width: 100%;
          min-width: 0;
        }

        .bottom-bar {
          flex-direction: column;
          align-items: stretch;
        }

        .title-box {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="live-shell">
      <div class="video-stage">
        <video id="previewVideo" autoplay muted playsinline></video>
      </div>
      <div class="overlay"></div>

      <div class="live-badge"><span class="dot"></span> Live</div>

      <header class="topbar">
        <div class="user-group">
          <div class="avatar">M</div>
          <div class="user-meta">
            <div class="name-row">
              <span class="name">masiyatunda</span>
              <span class="badge-check">✓</span>
            </div>
            <div class="viewer-chip"><span class="dot"></span> <span id="viewerCount">12.4K</span></div>
          </div>
        </div>

        <button class="lock-btn" type="button" aria-label="Lock">🔒</button>
      </header>

      <aside class="side-controls" aria-label="Live settings">
        <button class="control-btn" id="micToggle" type="button" aria-label="Toggle microphone">🎙️</button>
        <button class="control-btn" id="flipCamera" type="button" aria-label="Flip camera">🔄</button>
      </aside>

      <div class="action-stack" aria-label="Engagement actions">
        <div class="action-pill">
          <div class="icon">❤️</div>
          <div class="count">12.8K</div>
        </div>
        <div class="action-pill">
          <div class="icon">💬</div>
          <div class="count">2.3K</div>
        </div>
        <div class="action-pill">
          <div class="icon">🎁</div>
          <div class="count">847</div>
        </div>
      </div>

      <div class="bottom-bar">
        <div class="title-box">
          <div class="input-wrap">
            <input id="streamTitle" type="text" value="Live from my room" placeholder="Kichwa cha live..." />
          </div>
        </div>

        <div class="action-group">
          <button class="secondary-btn" id="previewBtn" type="button">Preview</button>
          <button class="primary-btn" id="startBtn" type="button">Start Live</button>
        </div>
      </div>
    </div>

    <script>
      const video = document.getElementById('previewVideo');
      const startBtn = document.getElementById('startBtn');
      const previewBtn = document.getElementById('previewBtn');
      const micToggle = document.getElementById('micToggle');
      const flipCamera = document.getElementById('flipCamera');
      const viewerCount = document.getElementById('viewerCount');
      const streamTitle = document.getElementById('streamTitle');

      const state = {
        stream: null,
        live: false,
        micOn: true,
        facingMode: 'user'
      };

      function updateMicBtn() {
        micToggle.textContent = state.micOn ? '🎙️' : '🔇';
        micToggle.classList.toggle('mic-off', !state.micOn);
      }

      function updateStartBtn() {
        startBtn.textContent = state.live ? 'End Live' : 'Start Live';
        startBtn.classList.toggle('live', state.live);
      }

      function setViewer(value) {
        viewerCount.textContent = value;
      }

      async function requestCamera() {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          alert('Browser yako haitumii camera access.');
          return null;
        }

        try {
          const constraints = {
            video: {
              facingMode: state.facingMode,
              width: { ideal: 1280 },
              height: { ideal: 720 }
            },
            audio: {
              echoCancellation: true,
              noiseSuppression: true,
              autoGainControl: true
            }
          };

          const stream = await navigator.mediaDevices.getUserMedia(constraints);
          state.stream = stream;
          video.srcObject = stream;
          video.classList.toggle('flip', state.facingMode === 'user');

          stream.getAudioTracks().forEach((track) => {
            track.enabled = state.micOn;
          });

          return stream;
        } catch (error) {
          console.error('Error accessing camera:', error);
          alert('Usijaribu kamera au mikrofono. Ruhusu access kwanza.');
          return null;
        }
      }

      async function previewStream() {
        if (!state.stream) {
          await requestCamera();
        }

        if (state.stream) {
          video.play();
        }
      }

      async function startLiveSession() {
        if (!state.stream) {
          await requestCamera();
        }

        if (!state.stream) return;

        state.live = true;
        updateStartBtn();
        setViewer('12.4K');

        const title = streamTitle.value.trim();
        if (title) {
          document.title = `${title} • LIVE`;
        }
      }

      function endLiveSession() {
        state.live = false;
        updateStartBtn();
        setViewer('0');
      }

      function toggleMic() {
        if (state.stream) {
          state.stream.getAudioTracks().forEach((track) => {
            track.enabled = !track.enabled;
          });
        }

        state.micOn = !state.micOn;
        updateMicBtn();
      }

      async function flipVideo() {
        state.facingMode = state.facingMode === 'user' ? 'environment' : 'user';

        if (state.stream) {
          state.stream.getTracks().forEach((track) => track.stop());
          state.stream = null;
        }

        await requestCamera();
      }

      startBtn.addEventListener('click', () => {
        if (state.live) {
          endLiveSession();
          return;
        }

        startLiveSession();
      });

      previewBtn.addEventListener('click', async () => {
        await previewStream();
      });

      micToggle.addEventListener('click', toggleMic);
      flipCamera.addEventListener('click', flipVideo);

      updateMicBtn();
      updateStartBtn();
      previewStream();
    </script>
  </body>
</html>
